<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام</title>
    <link rel="stylesheet" href="../../static/css/signup.css">
</head>
<body>

    <div class="login-card">

        <h1 class="title">خوش آمدید</h1>
        <p class="subtitle">برای ادامه حساب کاربری بسازید</p>

        <form id="signup-form">

            <input
                class="input-text"
                id="email"
                type="email"
                placeholder="ایمیل خود را وارد کنید"
            >

            <input
                class="input-text"
                id="password1"
                type="password"
                placeholder="رمز عبور"
            >

            <input
                class="input-text"
                id="password2"
                type="password"
                placeholder="تکرار رمز عبور"
            >

            <button type="submit" id="send" class="login-btn">
                ثبت نام
            </button>

        </form>

    </div>

    <script src="../../static/js/signup.js"></script>

</body>
</html>
