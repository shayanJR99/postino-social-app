{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Box</title>
    <link rel="stylesheet" href="{% static 'css/post.css' %}">
</head>
<body>

<form class="text-box"
      action="{% url 'posts:postcreate' %}"
      method="post"
      enctype="multipart/form-data">

    {% csrf_token %}


    <div class="user-info">

        {% if request.user.profile.image %}
            <img src="{{ request.user.profile.image.url }}"
                 alt="Profile"
                 class="profile-img">
        {% else %}
            <img src="{% static 'images/profile_Guest.png' %}"
                 class="profile-img"
                 alt="Default Profile">
        {% endif %}

        <p class="id">
            @{{ request.user.profile.username }}
            <span class="online"></span>
        </p>

    </div>
    <h1>نوشتن پست جدید</h1>

    <!-- CONTENT (اصلی) -->
    <textarea class="thread-input"
              name="content"
              placeholder="چه چیزی در ذهنت هست؟"
              required></textarea>

    <!-- IMAGE -->
    <input type="file"
           name="image"
           accept="image/*"
           class="post-image-input">



    <div class="btn-box">
        <button type="submit" class="send-btn">
            ارسال
        </button>
    </div>

</form>

<script src="{% static 'js/post.js' %}"></script>

</body>
</html>
