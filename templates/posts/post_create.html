{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Box</title>
    <link rel="stylesheet" href="{% static 'css/post.css' %}">
</head>
<body>
{% include "includes/sidebar.html" %}
<form class="text-box"
      action="{% url 'posts:postcreate' %}"
      method="post"
      enctype="multipart/form-data">

    {% csrf_token %}

    <div class="image-preview-box">
        <div class="image-preview" id="previewContainer"></div>
    </div>

    <div class="user-info">

        {% if request.user.profile.image %}
            <img src="{{ request.user.profile.image.url }}"
                 alt="Profile"
                 class="profile-img">
        {% else %}
            <img src="{% static 'images/profile_Guest.png' %}"
                 alt="Profile"
                 class="profile-img">
        {% endif %}

        <p class="id">
            @{{ request.user.profile.username }}
            <span class="online"></span>
        </p>

    </div>

    <h1>نوشتن پست جدید</h1>

    <textarea
        class="input-text"
        name="content"
        placeholder="چه چیزی در ذهنت هست؟"
        required></textarea>

    <label class="upload-btn">

        انتخاب عکس

        <input
            type="file"
            id="imageInput"
            name="image"
            accept="image/*"
            multiple
            class="post-image-input">

    </label>

    <div class="btn-box">

        <button
            type="submit"
            class="send-btn">

            ارسال پست

        </button>

    </div>

</form>

<script src="{% static 'js/post.js' %}"></script>

</body>
</html>
