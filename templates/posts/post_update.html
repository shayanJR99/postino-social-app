{% load static %}

<!doctype html>

<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ویرایش پست</title>

    ```
    <link rel="stylesheet" href="{% static 'css/post_update.css' %}" />
    ```
  </head>

  <body>
    {% include "includes/sidebar.html" %}
    <main class="update-post-container">
      <div class="update-post-card">
        <div class="update-post-header">
          <h1 class="update-post-title">ویرایش پست</h1>

          <p class="current-post-title">{{ post.title }}</p>
        </div>

        <form
          method="post"
          enctype="multipart/form-data"
          class="update-post-form"
        >
          {% csrf_token %}



          <div class="form-group">
            <label for="{{ form.content.id_for_label }}"> محتوا </label>

            {{ form.content }}
          </div>

          <div class="form-group">
            <label for="{{ form.image.id_for_label }}"> تصویر </label>

            {{ form.image }}
          </div>

          <div class="form-actions">
            <button type="submit" class="update-btn">ذخیره تغییرات</button>
          </div>
        </form>
      </div>
    </main>
    ```
  </body>
</html>
